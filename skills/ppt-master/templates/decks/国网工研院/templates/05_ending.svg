<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  font-family="Microsoft YaHei, PingFang SC, sans-serif"
  data-pptx-master="sgcc-institute" data-pptx-master-name="SGCC Institute"
  data-pptx-layout="closing" data-pptx-layout-name="Closing">
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <image id="ending-map" x="0" y="0" width="1280" height="720"
    href="../images/world_map_bg.png" preserveAspectRatio="none" opacity="0.6"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-top-rule" x1="56" y1="132" x2="1224" y2="132"
    stroke="#D9E4E1" stroke-width="1"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <image id="ending-logo" x="56" y="30" width="300" height="92"
    href="../images/logo_lockup.png" preserveAspectRatio="none"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="ending-brand-band" x="0" y="150" width="1280" height="440" fill="#00746F"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <image id="ending-wave" x="0" y="150" width="981" height="440"
    href="../images/wave_ribbon.png" preserveAspectRatio="none"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-band-top" x1="0" y1="150" x2="1280" y2="150"
    stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-band-bottom" x1="0" y1="590" x2="1280" y2="590"
    stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"
    data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="ending-title-slot" data-pptx-placeholder="body" data-pptx-idx="2"
    data-pptx-bounds="120 294 1040 104">
    <text id="ending-title-carrier" data-pptx-carrier="true"
      x="640" y="372" text-anchor="middle" xml:space="preserve"
      font-size="72" fill="#FFFFFF" font-weight="bold">{{THANK_YOU}}</text>
  </g>
  <g id="ending-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="120 400 1040 50">
    <text id="ending-subtitle-carrier" data-pptx-carrier="true"
      x="640" y="440" text-anchor="middle" xml:space="preserve"
      font-size="26" fill="#FFFFFF" font-weight="normal">{{ENDING_SUBTITLE}}</text>
  </g>
</svg>
