<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  font-family="Microsoft YaHei, PingFang SC, sans-serif"
  data-pptx-master="sgcc-institute" data-pptx-master-name="SGCC Institute"
  data-pptx-layout="content-text" data-pptx-layout-name="Content – Text">
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <image id="content-map" x="0" y="0" width="1280" height="720"
    href="../images/world_map_bg.png" preserveAspectRatio="none" opacity="0.72"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <path id="content-header-mark" d="M 0 16 L 0 78 L 52 47 Z" fill="#076654"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="content-header-rule" x="0" y="88" width="1280" height="6" fill="#007671"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <image id="content-logo" x="1024" y="8" width="200" height="61"
    href="../images/logo_lockup.png" preserveAspectRatio="none"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="content-text-rail" x="68" y="176" width="4" height="472" fill="#CDDAD3"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="content-footer-rule" x="0" y="712" width="1280" height="8" fill="#00746F"
    data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="content-title-slot" data-pptx-placeholder="title" data-pptx-bounds="64 24 900 58">
    <text id="content-title-carrier" data-pptx-carrier="true"
      x="68" y="64" text-anchor="start" xml:space="preserve"
      font-size="32" fill="#00746F" font-weight="bold">{{PAGE_TITLE}}</text>
  </g>
  <g id="content-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="64 112 1144 44">
    <text id="content-subtitle-carrier" data-pptx-carrier="true"
      x="68" y="146" text-anchor="start" xml:space="preserve"
      font-size="22" fill="#076654" font-weight="bold">{{SUBTITLE}}</text>
  </g>
  <g id="content-body-slot" data-pptx-placeholder="body" data-pptx-idx="2"
    data-pptx-bounds="88 176 1112 472">
    <text id="content-body-carrier" data-pptx-carrier="true"
      x="92" y="214" text-anchor="start" xml:space="preserve"
      font-size="22" fill="#1F2A28" font-weight="normal">{{CONTENT_AREA}}</text>
  </g>
  <g id="content-page-slot" data-pptx-placeholder="slide-number"
    data-pptx-bounds="1160 674 88 34">
    <text id="content-page-carrier" data-pptx-carrier="true"
      x="1232" y="700" text-anchor="end" xml:space="preserve"
      font-size="18" fill="#00746F" font-weight="bold">{{PAGE_NUM}}</text>
  </g>
</svg>
