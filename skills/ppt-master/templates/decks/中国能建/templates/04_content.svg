<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="ceec_master" data-pptx-master-name="CEEC"
  data-pptx-layout="content" data-pptx-layout-name="Title and Content">
  <rect id="ceec-master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <svg id="content-header-logo" x="989.9" y="17.83" width="258.17" height="62.83"
    viewBox="0.03528 0 0.97153 1" preserveAspectRatio="none"
    data-pptx-layer="layout" data-pptx-editable="false">
    <image href="../images/logo_top_right.png" x="0" y="0" width="1" height="1"
      preserveAspectRatio="none"/>
  </svg>
  <line id="content-header-rule" x1="0" y1="94.83" x2="1280" y2="94.83" stroke="#0068B7"
    stroke-width="6" data-pptx-layer="layout" data-pptx-editable="false"/>
  <svg id="content-watermark" x="-0.07" y="0.07" width="1280.07" height="719.93"
    viewBox="0.24014 0.07905 0.54211 0.71034" preserveAspectRatio="none"
    data-pptx-layer="layout" data-pptx-editable="false">
    <image href="../images/content_watermark.png" x="0" y="0" width="1" height="1"
      preserveAspectRatio="none"/>
  </svg>
  <rect id="content-panel" x="20" y="111.28" width="1240" height="583.7" fill="#F2F2F2"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="content-section-bar" x="20" y="115.23" width="1240" height="68.17" fill="#005DA2"
    data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="content-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="40 26 900 52">
    <text id="content-title-carrier" data-pptx-carrier="true"
      x="55.6" y="62.1"
      font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" font-size="32"
      fill="#0068B7" font-weight="bold">{{PAGE_TITLE}}</text>
  </g>
  <g id="content-section-slot" data-pptx-placeholder="body" data-pptx-idx="1"
    data-pptx-bounds="46 126 1180 48">
    <text id="content-section-carrier" data-pptx-carrier="true"
      x="50" y="155"
      font-family="Times New Roman, Microsoft YaHei, PingFang SC, sans-serif" font-size="26.67"
      fill="#FFFFFF" font-weight="bold">{{SECTION_TITLE}}</text>
  </g>
  <g id="content-object-slot" data-pptx-placeholder="object" data-pptx-idx="2"
    data-pptx-bounds="52 196 1188 470">
    <text id="content-object-carrier" data-pptx-carrier="true"
      x="57.13" y="222.29"
      font-family="Times New Roman, Microsoft YaHei, PingFang SC, sans-serif" font-size="24"
      fill="#000000">{{CONTENT_AREA}}</text>
  </g>
  <g id="content-date-slot" data-pptx-placeholder="date" data-pptx-idx="3"
    data-pptx-bounds="72 678 400 30">
    <text id="content-date-carrier" data-pptx-carrier="true"
      x="96" y="700"
      font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16"
      fill="#000000">{{DATE}}</text>
  </g>
  <g id="content-slide-number-slot" data-pptx-placeholder="slide-number" data-pptx-idx="4"
    data-pptx-bounds="1100 678 108 30">
    <text id="content-slide-number-carrier" data-pptx-carrier="true"
      x="1192" y="700" text-anchor="end"
      font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" font-size="16"
      fill="#000000">{{PAGE_NUM}}</text>
  </g>
</svg>
