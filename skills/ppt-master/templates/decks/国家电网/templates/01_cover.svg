<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="sgcc_photo_master" data-pptx-master-name="SGCC Photo"
  data-pptx-layout="cover" data-pptx-layout-name="Cover">
  <defs>
    <linearGradient id="bottomFade" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <image id="sgcc-photo-master-background" x="0" y="-2" width="1292.93" height="725.07"
    href="../images/cover_bg.png" preserveAspectRatio="none"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="sgcc-photo-master-scrim" x="0" y="360" width="1280" height="360"
    fill="url(#bottomFade)" data-pptx-layer="master" data-pptx-editable="false"/>
  <image id="sgcc-photo-master-logo" x="80" y="58" width="170" height="56"
    href="../images/logo_small.png" preserveAspectRatio="none"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <g id="cover-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="80 238 900 84">
    <text id="cover-title-carrier" data-pptx-carrier="true"
      x="80" y="290" text-anchor="start" xml:space="preserve"
      font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="56"
      fill="#FFFFFF" font-weight="bold">{{TITLE}}</text>
  </g>
  <g id="cover-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="80 546 900 48">
    <text id="cover-subtitle-carrier" data-pptx-carrier="true"
      x="80" y="580" text-anchor="start" xml:space="preserve"
      font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28"
      fill="#FFFFFF" font-weight="bold">{{SUBTITLE}}</text>
  </g>
  <g id="cover-date-slot" data-pptx-placeholder="date" data-pptx-idx="2"
    data-pptx-bounds="80 596 400 40">
    <text id="cover-date-carrier" data-pptx-carrier="true"
      x="80" y="625" text-anchor="start" xml:space="preserve"
      font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22"
      fill="#FFFFFF" font-weight="bold">{{DATE}}</text>
  </g>
</svg>
